[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gflownet-prover-ui"
version = "0.1.0"
description = "Native Desktop User Interface for GFlowNet-Prover (Pure Rust / Foundry Edition)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GFlowNet-Prover Architecture Team" }
]
dependencies = [
    "PySide6>=6.8.0",
    "pyqtgraph>=0.13.7",
    "qasync>=0.27.1",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "psutil>=5.9.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
gfn-prover-ui = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
